<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة التعلم النظري 💡</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- ====== شريط علوي ====== -->
    <header class="navbar">
        <div class="logo">
            <i class="fas fa-graduation-cap"></i>
            <span>Learn<span>Pro</span></span>
            <span class="badge-version">v5.0</span>
        </div>
        <div class="nav-actions">
            <button id="themeToggle"><i class="fas fa-moon"></i></button>
            <button id="profileBtn"><i class="fas fa-user-circle"></i></button>
        </div>
    </header>

    <!-- ====== لوحة التحكم ====== -->
    <section class="dashboard" id="dashboard">
        <div class="stats-grid">
            <div class="stat-card"><i class="fas fa-language"></i><h3 id="totalTracks">0</h3><p>لغات</p></div>
            <div class="stat-card"><i class="fas fa-book"></i><h3 id="totalLessons">0</h3><p>دروس</p></div>
            <div class="stat-card"><i class="fas fa-star"></i><h3 id="userScore">0</h3><p>نقاطك</p></div>
            <div class="stat-card"><i class="fas fa-certificate"></i><h3 id="userBadges">0</h3><p>شهادات</p></div>
        </div>
        <div class="tracks-container">
            <h2><i class="fas fa-route"></i> اختر مسارك التعليمي</h2>
            <div class="tracks-grid" id="trackGrid"></div>
        </div>
    </section>

    <!-- ====== صفحة الدرس ====== -->
    <section class="lesson-panel" id="lessonPanel" style="display:none;">
        <div class="lesson-header">
            <button id="backBtn"><i class="fas fa-arrow-right"></i> العودة</button>
            <h2 id="lessonTitle">الدرس</h2>
            <span class="level-badge" id="levelBadge">مستوى 0</span>
        </div>
        <div class="lesson-body">
            <!-- صورة الدرس -->
            <div class="lesson-image" id="lessonImage">
                <img id="lessonImg" src="" alt="صورة توضيحية" />
            </div>

            <!-- استخدامات اللغة -->
            <div class="language-uses" id="languageUses">
                <h3><i class="fas fa-briefcase"></i> استخدامات اللغة</h3>
                <div id="usesContent"></div>
            </div>

            <!-- الشرح النظري -->
            <div class="explanation" id="explanation"></div>

            <!-- الكود التوضيحي -->
            <div class="code-display">
                <div class="code-header"><span><i class="fas fa-code"></i> كود توضيحي</span></div>
                <pre id="codeExample"><code></code></pre>
                <div class="code-explanation" id="codeExplanation"></div>
            </div>

            <!-- ملخص -->
            <div class="summary-box" id="summaryBox">
                <h3><i class="fas fa-list-check"></i> ملخص الدرس</h3>
                <ul id="summaryList"></ul>
            </div>

            <!-- الاختبارات -->
            <div class="quiz-section" id="quizSection">
                <h3><i class="fas fa-question-circle"></i> اختبارات الدرس</h3>
                <div id="quizBody"></div>
                <button id="submitQuizBtn" class="quiz-submit">تأكيد الإجابات</button>
                <div id="quizResult"></div>
            </div>

            <button id="completeLevelBtn" class="complete-btn"><i class="fas fa-award"></i> إنهاء المستوى</button>
        </div>
    </section>

    <!-- ====== الملف الشخصي ====== -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <button id="closeProfile" class="modal-close"><i class="fas fa-times"></i></button>
            <h2>👤 ملفي الشخصي</h2>
            <div id="profileInfo">
                <div class="profile-stats">
                    <div><strong>النقاط:</strong> <span id="profileScore">0</span></div>
                    <div><strong>الدروس المكتملة:</strong> <span id="profileLessons">0</span></div>
                    <div><strong>الشهادات:</strong> <span id="profileCertificates">0</span></div>
                </div>
                <button id="exportProgressBtn"><i class="fas fa-download"></i> تصدير التقدم</button>
                <button id="resetProgressBtn" class="danger"><i class="fas fa-trash"></i> إعادة تعيين</button>
            </div>
        </div>
    </div>

    <!-- ====== إشعارات ====== -->
    <div id="toast" class="toast"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
