<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة الاحتراف البرمجي 🚀</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- ====== شريط علوي ====== -->
    <header class="navbar">
        <div class="logo"><i class="fas fa-code"></i> Pro<span>Code</span></div>
        <div class="nav-actions">
            <button id="themeToggle"><i class="fas fa-moon"></i></button>
            <button id="langToggle">EN</button>
            <button id="profileBtn"><i class="fas fa-user-circle"></i></button>
        </div>
    </header>

    <!-- ====== لوحة التحكم ====== -->
    <section class="dashboard" id="dashboard">
        <div class="stats-grid">
            <div class="stat-card"><i class="fas fa-language"></i><h3 id="totalTracks">0</h3><p>لغات</p></div>
            <div class="stat-card"><i class="fas fa-layer-group"></i><h3 id="totalLevels">0</h3><p>مستويات</p></div>
            <div class="stat-card"><i class="fas fa-star"></i><h3 id="userScore">0</h3><p>نقاطك</p></div>
            <div class="stat-card"><i class="fas fa-certificate"></i><h3 id="userBadges">0</h3><p>شهادات</p></div>
        </div>
        <div class="tracks-container">
            <h2><i class="fas fa-route"></i> اختر مسارك التعليمي</h2>
            <div class="tracks-grid" id="trackGrid"></div>
        </div>
    </section>

    <!-- ====== لوحة الدرس ====== -->
    <section class="lesson-panel" id="lessonPanel" style="display:none;">
        <div class="lesson-header">
            <button id="backBtn"><i class="fas fa-arrow-right"></i> العودة</button>
            <h2 id="lessonTitle">الدرس</h2>
            <span class="level-badge" id="levelBadge">مستوى 0</span>
        </div>
        <div class="lesson-body">
            <div class="explanation" id="explanation"></div>
            <div class="code-runner">
                <div class="code-header"><span><i class="fas fa-terminal"></i> محطة التشغيل</span><button id="copyCodeBtn"><i class="fas fa-copy"></i></button></div>
                <textarea id="codeEditor" rows="6" spellcheck="false"></textarea>
                <div class="code-actions">
                    <button id="runCodeBtn"><i class="fas fa-play"></i> تشغيل</button>
                    <button id="resetCodeBtn"><i class="fas fa-undo"></i> إعادة</button>
                </div>
                <div class="output-box"><span class="output-label">📤 المخرجات:</span><pre id="outputContent">⏳ انتظر التنفيذ...</pre></div>
            </div>
            <div class="quiz-section" id="quizSection">
                <h3><i class="fas fa-question-circle"></i> اختبار المستوى</h3>
                <div id="quizBody"></div>
                <button id="submitQuizBtn" class="quiz-submit">تأكيد الإجابة</button>
                <div id="quizResult"></div>
            </div>
            <button id="completeLevelBtn" class="complete-btn"><i class="fas fa-check-circle"></i> إنهاء المستوى</button>
        </div>
    </section>

    <!-- ====== الملف الشخصي ====== -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <button id="closeProfile" class="modal-close"><i class="fas fa-times"></i></button>
            <h2>👤 ملفي الشخصي</h2>
            <div id="profileInfo">
                <p><strong>النقاط:</strong> <span id="profileScore">0</span></p>
                <p><strong>المستويات المكتملة:</strong> <span id="profileLevels">0</span></p>
                <p><strong>الشهادات:</strong> <span id="profileCertificates">0</span></p>
                <button id="exportProgressBtn"><i class="fas fa-download"></i> تصدير التقدم</button>
                <button id="resetProgressBtn" class="danger"><i class="fas fa-trash"></i> إعادة تعيين</button>
            </div>
        </div>
    </div>

    <!-- ====== إشعارات ====== -->
    <div id="toast" class="toast"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
